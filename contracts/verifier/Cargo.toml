[package]
name = "semaphore-stellar-verifier"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Groth16/BN254 verifier for Semaphore v4 proofs on Soroban/Stellar (reuses Ethereum's ceremony)"
repository = "https://github.com/edenbd1/semaphore-stellar"
readme = "README.md"
keywords = ["semaphore", "stellar", "soroban", "zk", "bn254"]
categories = ["cryptography", "no-std"]

[lib]
name = "semaphore_verifier"
crate-type = ["cdylib", "rlib"]

[features]
default = ["build-contract"]
build-contract = []

[dependencies]
soroban-sdk = "29"

[dev-dependencies]
soroban-sdk = { version = "29", features = ["testutils"] }
